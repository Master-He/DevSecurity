server:
  port: ${SERVER_PORT:8082}
  shutdown: graceful

spring:
  application:
    name: core-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/devsecurity}
    username: ${DB_USER:devsecurity}
    password: ${DB_PASSWORD:devsecurity}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:12}
      minimum-idle: 2
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 101MB

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

app:
  admin:
    username: ${APP_ADMIN_USERNAME:admin}
    password: ${APP_ADMIN_PASSWORD:}
    display-name: ${APP_ADMIN_DISPLAY_NAME:平台管理员}
  jwt:
    secret: ${JWT_SECRET:}
    ttl-hours: ${JWT_TTL_HOURS:12}
  storage:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    access-key: ${S3_ACCESS_KEY:devsecurity}
    secret-key: ${S3_SECRET_KEY:devsecurity-local-change-me}
    bucket: ${S3_BUCKET:devsecurity}
    region: ${S3_REGION:us-east-1}
  git:
    allowed-hosts: ${GIT_ALLOWED_HOSTS:localhost,gitlab.com}
    timeout-seconds: ${GIT_TIMEOUT_SECONDS:120}
  scan:
    sca-url: ${SCA_URL:http://localhost:8086}
    sca-service-token: ${SCA_SERVICE_TOKEN:}
    work-root: ${SCA_WORK_ROOT:.data/sca-work}
    sca-poll-ms: ${SCA_POLL_MS:1000}
    worker-poll-ms: ${SCAN_WORKER_POLL_MS:3000}
    execution-timeout-seconds: ${SCAN_EXECUTION_TIMEOUT_SECONDS:1800}
    source-retention-days: ${SOURCE_RETENTION_DAYS:3}
    result-retention-days: ${RESULT_RETENTION_DAYS:180}
