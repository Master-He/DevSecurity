spring:
  datasource:
    url: jdbc:h2:mem:devsecurity;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: false

eureka:
  client:
    enabled: true
    register-with-eureka: true
    fetch-registry: false

app:
  admin:
    password: ${APP_ADMIN_PASSWORD:admin123}
  jwt:
    secret: ${JWT_SECRET:01234567890123456789012345678912}
  storage:
    kind: filesystem
    directory: ${LOCAL_STORAGE_DIRECTORY:.data/artifacts}
  scan:
    sca-url: ${SCA_URL:http://localhost:8086}
    sca-service-token: ${SCA_SERVICE_TOKEN:123}
    work-root: ${SCA_WORK_ROOT:${user.home}/.dev-security/sca-work}
