spring:
  datasource:
    url: jdbc:h2:mem:devsecurity;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

app:
  storage:
    kind: filesystem
    directory: ${LOCAL_STORAGE_DIRECTORY:.data/artifacts}
  scan:
    sca-url: ${SCA_URL:http://localhost:8086}
